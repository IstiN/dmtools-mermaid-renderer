<svg id="mermaid-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 172" style="max-width: 1360px;" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-diagram .error-icon{fill:#552222;}#mermaid-diagram .error-text{fill:#552222;stroke:#552222;}#mermaid-diagram .edge-thickness-normal{stroke-width:1px;}#mermaid-diagram .edge-thickness-thick{stroke-width:3.5px;}#mermaid-diagram .edge-pattern-solid{stroke-dasharray:0;}#mermaid-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-diagram .marker{fill:#333333;stroke:#333333;}#mermaid-diagram .marker.cross{stroke:#333333;}#mermaid-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-diagram p{margin:0;}#mermaid-diagram .mermaid-main-font{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-diagram .exclude-range{fill:#eeeeee;}#mermaid-diagram .section{stroke:none;opacity:0.2;}#mermaid-diagram .section0{fill:rgba(102, 102, 255, 0.49);}#mermaid-diagram .section2{fill:#fff400;}#mermaid-diagram .section1,#mermaid-diagram .section3{fill:white;opacity:0.2;}#mermaid-diagram .sectionTitle0{fill:#333;}#mermaid-diagram .sectionTitle1{fill:#333;}#mermaid-diagram .sectionTitle2{fill:#333;}#mermaid-diagram .sectionTitle3{fill:#333;}#mermaid-diagram .sectionTitle{text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif