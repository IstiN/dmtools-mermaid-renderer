ext0.taskTextOutsideRight,#mermaid-diagram .doneText1.taskTextOutsideLeft,#mermaid-diagram .doneText1.taskTextOutsideRight,#mermaid-diagram .doneText2.taskTextOutsideLeft,#mermaid-diagram .doneText2.taskTextOutsideRight,#mermaid-diagram .doneText3.taskTextOutsideLeft,#mermaid-diagram .doneText3.taskTextOutsideRight{fill:black!important;}#mermaid-diagram .crit0,#mermaid-diagram .crit1,#mermaid-diagram .crit2,#mermaid-diagram .crit3{stroke:#ff8888;fill:red;stroke-width:2;}#mermaid-diagram .activeCrit0,#mermaid-diagram .activeCrit1,#mermaid-diagram .activeCrit2,#mermaid-diagram .activeCrit3{stroke:#ff8888;fill:#bfc7ff;stroke-width:2;}#mermaid-diagram .doneCrit0,#mermaid-diagram .doneCrit1,#mermaid-diagram .doneCrit2,#mermaid-diagram .doneCrit3{stroke:#ff8888;fill:lightgrey;stroke-width:2;cursor:pointer;shape-rendering:crispEdges;}#mermaid-diagram .milestone{transform:rotate(45deg) scale(0.8,0.8);}#mermaid-diagram .milestoneText{font-style:italic;}#mermaid-diagram .doneCritText0,#mermaid-diagram .doneCritText1,#mermaid-diagram .doneCritText2,#mermaid-diagram .doneCritText3{fill:black!important;}#mermaid-diagram .doneCritText0.taskTextOutsideLeft,#mermaid-diagram .doneCritText0.taskTextOutsideRight,#mermaid-diagram .doneCritText1.taskTextOutsideLeft,#mermaid-diagram .doneCritText1.taskTextOutsideRight,#mermaid-diagram .doneCritText2.taskTextOutsideLeft,#mermaid-diagram .doneCritText2.taskTextOutsideRight,#mermaid-diagram .doneCritText3.taskTextOutsideLeft,#mermaid-diagram .doneCritText3.taskTextOutsideRight{fill:black!important;}#mermaid-diagram .vert{stroke:navy;}#mermaid-diagram .vertText{font-size:15px;text-anchor:middle;fill:navy!important;}#mermaid-diagram .activeCritText0,#mermaid-diagram .activeCritText1,#mermaid-diagram .activeCritText2,#mermaid-diagram .activeCritText3{fill:black!important;}#mermaid-diagram .titleText{text-anchor:middle;font-size:18px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-diagram .node .neo-node{stroke:#9370DB;}