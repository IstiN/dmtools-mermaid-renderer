<svg id="mermaid-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 634.234375 450" style="max-width: 634.234375px;" role="graphics-document document" aria-roledescription="pie"><style>#mermaid-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-diagram .error-icon{fill:#552222;}#mermaid-diagram .error-text{fill:#552222;stroke:#552222;}#mermaid-diagram .edge-thickness-normal{stroke-width:1px;}#mermaid-diagram .edge-thickness-thick{stroke-width:3.5px;}#mermaid-diagram .edge-pattern-solid{stroke-dasharray:0;}#mermaid-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-diagram .marker{fill:#333333;stroke:#333333;}#mermaid-diagram .marker.cross{stroke:#333333;}#mermaid-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-diagram p{margin:0;}#mermaid-diagram .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#mermaid-diagram .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#mermaid-diagram .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-diagram .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#mermaid-diagram .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#mermaid-diagram .node .neo-node{stroke:#9370DB;}#mermaid-diagram [data-look="neo"].node rect,#mermaid-diagram [data-look="neo"].cluster rect,#mermaid-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,57.168,175.945L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M57.168,175.945A185,185,0,0,1,-185,0L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-185,0A185,185,0,0,1,0,-185L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><text transform="translate(137.04175725757537,-21.705282024332003)" class="slice" style="text-anchor: middle;">45%</text><text transform="translate(-81.55520375558073,112.2511079695239)" class="slice" style="text-anchor: middle;">30%</text><text transform="translate(-98.1110658896334,-98.11106588963354)" class="slice" style="text-anchor: middle;">25%</text><text x="0" y="-200" class="pieTitleText">Renderer work split</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"></rect><text x="22" y="14">DOM shim</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"></rect><text x="22" y="14">Mermaid bundle</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"></rect><text x="22" y="14">Tests</text></g></g></svg>