<svg id="mermaid-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 600px;" viewBox="0 0 600 400" role="graphics-document document" aria-roledescription="sankey"><style>#mermaid-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-diagram .error-icon{fill:#552222;}#mermaid-diagram .error-text{fill:#552222;stroke:#552222;}#mermaid-diagram .edge-thickness-normal{stroke-width:1px;}#mermaid-diagram .edge-thickness-thick{stroke-width:3.5px;}#mermaid-diagram .edge-pattern-solid{stroke-dasharray:0;}#mermaid-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-diagram .marker{fill:#333333;stroke:#333333;}#mermaid-diagram .marker.cross{stroke:#333333;}#mermaid-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-diagram p{margin:0;}#mermaid-diagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-diagram .node .neo-node{stroke:#9370DB;}#mermaid-diagram [data-look="neo"].node rect,#mermaid-diagram [data-look="neo"].cluster rect,#mermaid-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-diagram [data-look="n