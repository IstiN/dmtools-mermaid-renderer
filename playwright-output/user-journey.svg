<svg id="mermaid-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 1100px;" viewBox="0 -25 1100 540" preserveAspectRatio="xMinYMin meet" height="565" role="graphics-document document" aria-roledescription="journey"><style>#mermaid-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-diagram .error-icon{fill:#552222;}#mermaid-diagram .error-text{fill:#552222;stroke:#552222;}#mermaid-diagram .edge-thickness-normal{stroke-width:1px;}#mermaid-diagram .edge-thickness-thick{stroke-width:3.5px;}#mermaid-diagram .edge-pattern-solid{stroke-dasharray:0;}#mermaid-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-diagram .marker{fill:#333333;stroke:#333333;}#mermaid-diagram .marker.cross{stroke:#333333;}#mermaid-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-diagram p{margin:0;}#mermaid-diagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mermaid-diagram .mouth{stroke:#666;}#mermaid-diagram line{stroke:#333;}#mermaid-diagram .legend{fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-diagram .label text{fill:#333;}#mermaid-diagram .label{color:#333;}#mermaid-diagram .face{fill:#FFF8DC;stroke:#999;}#mermaid-diagram .node rect,#mermaid-diagram .node circle,#mermaid-diagram .node ellipse,#mermaid-diagram .node polygon,#mermaid-diagram .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid-diagram .node .label{text-align:center;}#mermaid-diagram .node.clickable{cursor:pointer;}#mermaid-diagram .arrowheadPath{fill:#333333;}#mermaid-diagram .edgePath .path{stroke:#333333;stroke-width:1.5px;}#mermaid-diagram .flowchart-link{stroke:#333333;fill:none;}#mermaid-diagram .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#mermaid-diagram .edgeLabel rect{opacity:0.5;}#mermaid-diagram .cluster text{fill:#333;}#mermaid-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#mermaid-diagram .task-type-0,#mermaid-diagram .section-type-0{fill:#ECECFF;}#mermaid-diagram .task-type-1,#mermaid-diagram .section-type-1{fill:#ffffde;}#mermaid-diagram .task-type-2,#mermaid-diagram .section-type-2{fill:hsl(304, 100%, 96.2745098039%);}#mermaid-diagram .task-type-3,#mermaid-diagram .section-type-3{fill:hsl(124, 100%, 93.5294117647%);}#mermaid-diagram .task-type-4,#mermaid-diagram .section-type-4{fill:hsl(176, 100%, 96.2745098039%);}#mermaid-diagram .task-type-5,#mermaid-diagram .section-type-5{fill:hsl(-4, 100%, 93.5294117647%);}#mermaid-diagram .task-type-6,#mermaid-diagram .section-type-6{fill:hsl(8, 100%, 96.2745098039%);}#mermaid-diagram .task-type-7,#mermaid-diagram .section-type-7{fill:hsl(188, 100%, 93.5294117647%);}#mermaid-diagram .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mermaid-diagram .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mermaid-diagram .node .neo-node{stroke:#9370DB;}#mermaid-diagram [data-look="neo"].node rect,#mermaid-diagram [data-look="neo"].cluster rect,#mermaid-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}