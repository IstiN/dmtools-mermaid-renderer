<svg id="mermaid-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#mermaid-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-diagram .error-icon{fill:#552222;}#mermaid-diagram .error-text{fill:#552222;stroke:#552222;}#mermaid-diagram .edge-thickness-normal{stroke-width:1px;}#mermaid-diagram .edge-thickness-thick{stroke-width:3.5px;}#mermaid-diagram .edge-pattern-solid{stroke-dasharray:0;}#mermaid-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-diagram .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-diagram .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-diagram .marker{fill:#333333;stroke:#333333;}#mermaid-diagram .marker.cross{stroke:#333333;}#mermaid-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-diagram p{margin:0;}#mermaid-diagram .node .neo-node{stroke:#9370DB;}#mermaid-diagram [data-look="neo"].node rect,#mermaid-diagram [data-look="neo"].cluster rect,#mermaid-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><rect width="700" height="500" class="background" fill="white"></rect><g class="chart-title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(350, 21.55078125) rotate(0)">Renderer quality over iterations</text></g><g class="plot"><g class="line-plot-0"><path d="M115.648,377.42L294.56,275.446L473.471,112.286L652.383,71.496" fill="none" stroke="#ECECFF" stroke-width="2"></path></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 68.03125,468 L 700,468" fill="none" stroke="#131300" stroke-width="2"></path></g><g class="label"><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(115.6484375, 479) rotate(0)">POC</text><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(294.55989583333337, 479) rotate(0)">Extracted</text><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(473.4713541666667, 479) rotate(0)">MermaidEngine</text><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(652.3828125, 479) rotate(0)">Validated</text></g><g class="ticks"><path d="M 115.6484375,469 L 115.6484375,474" fill="none" stroke="#131300" stroke-width="2"></path><path d="M 294.55989583333337,469 L 294.55989583333337,474" fill="none" stroke="#131300" stroke-width="2"></path><path